services:
  - type: web
    name: karnal-reality-whatsapp
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 3000
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
